<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home Screen (125-171)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./common.css">
  <link rel="stylesheet" href="./home-screen-125-171.css">
</head>
<body style="background: var(--color-252525); margin: 0;">
  <main class="screen-root" role="main" aria-label="Home Screen">
    <!-- Rectangle 8 -->
    <div id="el-125-175" class="abs" role="img" aria-label="Card background 1"></div>

    <!-- Book Review text -->
    <p id="el-125-176" class="abs text" aria-label="Book Review title">
      Book Review : The Design of Everyday Things by Don Norman
    </p>

    <!-- Empty text node (kept for fidelity) -->
    <span id="el-125-177" class="abs text" aria-hidden="true"></span>

    <!-- Rectangle 11 -->
    <div id="el-125-178" class="abs" role="img" aria-label="Card background 2"></div>

    <!-- Animes produced by Ufotable -->
    <p id="el-125-179" class="abs text">Animes produced by Ufotable</p>

    <!-- Rectangle 10 -->
    <div id="el-125-180" class="abs" role="img" aria-label="Card background 3"></div>

    <!-- Mangas planned to read -->
    <p id="el-125-181" class="abs text">Mangas planned to read</p>

    <!-- Hero Text -->
    <h1 id="el-125-186" class="abs" style="margin:0;">Notes</h1>

    <!-- Button 1 background -->
    <div id="el-125-187" class="abs button-like" role="button" aria-label="Info button" tabindex="0"></div>
    <!-- info_outline component -->
    <div id="el-125-188" class="abs" aria-hidden="false" role="img" aria-label="info icon">
      <div id="el-I125-188-8-7">
        <div id="el-I125-188-8-8" class="abs"></div>
        <img id="el-I125-188-8-9" class="abs icon" alt="info vector" src="figmaimages/figma_image_125_188_8_9.svg" width="20.000001907348633" height="20">
      </div>
    </div>

    <!-- Button 4 background -->
    <div id="el-125-189" class="abs button-like" role="button" aria-label="Search button" tabindex="0"></div>
    <!-- search component -->
    <div id="el-125-190" class="abs" role="img" aria-label="search icon">
      <div id="el-I125-190-8-11" class="abs"></div>
      <img id="el-I125-190-8-12" class="abs icon" alt="search vector" src="figmaimages/figma_image_125_190_8_12.svg" width="17.048128128051758" height="17.058124542236328">
    </div>

    <!-- Rectangle 13 -->
    <div id="el-136-37" class="abs" role="img" aria-label="Card background 4"></div>

    <!-- Rectangle 9 -->
    <div id="el-136-38" class="abs" role="img" aria-label="Card background 5"></div>

    <!-- Awesome tweets collection -->
    <p id="el-136-39" class="abs text">Awesome tweets collection</p>

    <!-- List of free & open source apps -->
    <p id="el-136-40" class="abs text">List of free & open source apps</p>

    <!-- Ellipse 1 -->
    <div id="el-125-191" class="abs" role="img" aria-label="Floating action background"></div>

    <!-- add component -->
    <div id="el-125-192" class="abs" role="button" aria-label="Add note" tabindex="0">
      <div id="el-I125-192-115-18" class="abs"></div>
      <img id="el-I125-192-115-19" class="abs icon" alt="add vector" src="figmaimages/figma_image_125_192_115_19.svg" width="28" height="28">
    </div>
  </main>

  <script src="./app.js"></script>
  <script src="./home-screen-125-171.js"></script>
</body>
</html>
